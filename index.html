<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site em manutenção</title>
  <style>
    :root {
      --bg-1: #0b1d3a;
      --bg-2: #1e4a8a;
      --accent: #38bdf8;
      --accent-2: #bae6fd;
      --text: #eff6ff;
      --muted: #93c5fd;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(147, 197, 253, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 30% 0%, var(--bg-2), var(--bg-1) 75%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 520px;
      width: 100%;
      padding: 32px 24px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      animation: fadeIn 0.8s ease-out both;
    }

    .scene {
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
      margin: 0 auto 16px;
    }

    .bob { animation: bob 2.4s ease-in-out infinite; }
    .typing { animation: type 0.6s ease-in-out infinite alternate; }
    .typing.t2 { animation-delay: 0.3s; }
    .float { animation: float 4s ease-in-out infinite; }
    .float.f2 { animation-delay: 1.5s; }
    .blink { animation: blink 3s steps(1) infinite; }
    .dot-anim { animation: pulse 1.4s ease-in-out infinite; }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
    }
    h1 span { color: var(--accent); }

    p.lead {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    p.sub {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-2);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes type {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.9; }
      50% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <svg class="scene" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pessoa trabalhando no notebook">
      <!-- Chão -->
      <ellipse cx="190" cy="236" rx="150" ry="10" fill="#0b1d3a" opacity="0.5"/>

      <!-- Mesa -->
      <rect x="60" y="170" width="260" height="10" rx="4" fill="#38bdf8"/>
      <rect x="82" y="180" width="8" height="54" fill="#0ea5e9"/>
      <rect x="290" y="180" width="8" height="54" fill="#0ea5e9"/>

      <!-- Notebook -->
      <rect x="150" y="128" width="90" height="46" rx="4" fill="#1e3a8a"/>
      <rect x="156" y="134" width="78" height="34" rx="2" fill="#93c5fd"/>
      <rect x="138" y="172" width="114" height="6" rx="3" fill="#cbd5e1"/>
      <!-- Linhas na tela -->
      <rect class="typing" x="162" y="142" width="40" height="3" rx="1.5" fill="#1e3a8a"/>
      <rect class="typing t2" x="162" y="150" width="58" height="3" rx="1.5" fill="#1e3a8a"/>
      <rect class="typing" x="162" y="158" width="30" height="3" rx="1.5" fill="#1e3a8a"/>

      <!-- Pessoa -->
      <g class="bob">
        <!-- Corpo -->
        <rect x="86" y="112" width="44" height="60" rx="16" fill="#0284c7"/>
        <!-- Braços -->
        <path d="M120 128 Q138 140 150 150" stroke="#0284c7" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle cx="152" cy="151" r="6" fill="#fcd9b6"/>
        <!-- Cabeça -->
        <circle cx="108" cy="94" r="22" fill="#fcd9b6"/>
        <!-- Capacete de obra (cúpula centrada na cabeça + aba) -->
        <path d="M86 84 A22 22 0 0 1 130 84 Z" fill="#fbbf24"/>
        <rect x="82" y="82" width="52" height="5" rx="2.5" fill="#f59e0b"/>
        <rect x="104" y="66" width="8" height="16" rx="2" fill="#f59e0b" opacity="0.6"/>
        <!-- Olhos e sorriso -->
        <circle class="blink" cx="102" cy="96" r="2" fill="#1e293b"/>
        <circle class="blink" cx="116" cy="96" r="2" fill="#1e293b"/>
        <path d="M102 104 Q109 110 116 104" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- Pernas -->
        <rect x="88" y="168" width="16" height="12" rx="4" fill="#1e3a8a"/>
        <rect x="112" y="168" width="16" height="12" rx="4" fill="#1e3a8a"/>
      </g>

      <!-- Engrenagem decorativa -->
      <g class="float" transform="translate(300 60)">
        <path fill="#38bdf8" opacity="0.8" d="M0 -18 L4 -16 L5 -11 L10 -9 L14 -12 L17 -9 L14 -5 L15 0 L18 4 L15 8 L11 6 L7 9 L8 14 L4 16 L0 13 L-4 16 L-8 14 L-7 9 L-11 6 L-15 8 L-18 4 L-15 0 L-14 -5 L-17 -9 L-14 -12 L-10 -9 L-5 -11 L-4 -16 Z"/>
        <circle r="6" fill="#0b1d3a"/>
      </g>

      <!-- Bolhas decorativas -->
      <circle class="float f2" cx="60" cy="60" r="6" fill="#7dd3fc" opacity="0.5"/>
      <circle class="float" cx="340" cy="130" r="4" fill="#7dd3fc" opacity="0.5"/>
      <circle class="float f2" cx="40" cy="130" r="3" fill="#bae6fd" opacity="0.4"/>
    </svg>

    <h1>Estamos <span>em manutenção</span></h1>
    <p class="lead">Estamos deixando o site ainda melhor para você.</p>
    <p class="sub">Voltamos em breve. Obrigado pela paciência!</p>

    <div class="status">
      <span class="dot dot-anim"></span>
      Trabalhando nisso agora
    </div>

    <footer>&copy; 2026 · Obrigado por esperar</footer>
  </main>
</body>
</html>
